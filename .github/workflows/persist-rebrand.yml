name: Persist generated app changes

on:
  push:
    branches:
      - "agent/**"
    paths:
      - scripts/rebrand_project.sh
      - scripts/port_psylog_compatibility.py
      - scripts/enable_modern_custom_substances.py
      - scripts/enable_modern_custom_editor.py
      - scripts/enable_modern_custom_export.py
      - scripts/enable_modern_custom_delete.py
      - .github/workflows/persist-rebrand.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  persist:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply permanent identity
        run: bash scripts/rebrand_project.sh

      - name: Port selected PsyLog compatibility fixes
        run: python3 scripts/port_psylog_compatibility.py

      - name: Enable Journal 14.x custom substances
        run: python3 scripts/enable_modern_custom_substances.py

      - name: Enable native custom-substance editor
        run: python3 scripts/enable_modern_custom_editor.py

      - name: Enable custom-substance export
        run: python3 scripts/enable_modern_custom_export.py

      - name: Enable custom-substance deletion
        run: python3 scripts/enable_modern_custom_delete.py

      - name: Validate generated files
        run: |
          plutil -lint "PsychonautWiki Journal/PsychonautWiki Journal.entitlements"
          grep -q "normalizeModernJournalExport" \
            "PsychonautWiki Journal/Settings/Settings-ViewModel.swift"
          grep -q "ModernCustomSubstanceStore" \
            "PsychonautWiki Journal/Decoding/SubstanceRepo.swift"
          grep -q "upsertCustomSubstance" \
            "PsychonautWiki Journal/Decoding/SubstanceRepo.swift"
          grep -q "static func exportData() throws -> Data" \
            "PsychonautWiki Journal/Decoding/SubstanceRepo.swift"
          grep -q "static func deleteUnit" \
            "PsychonautWiki Journal/Decoding/SubstanceRepo.swift"
          grep -q "includeDoseAndDuration" \
            "PsychonautWiki Journal/Search/Custom Substance/AddCustomSubstance-ViewModel.swift"
          grep -q "Delete Custom Substance" \
            "PsychonautWiki Journal/Search/Custom Substance/AddCustomSubstanceView.swift"
          grep -q "isShowingEditCustomSubstanceSheet" \
            "PsychonautWiki Journal/Search/Substance/SubstanceScreen.swift"
          grep -q "ModernCustomSubstanceDocument" \
            "PsychonautWiki Journal/Settings/SettingsScreen.swift"
          grep -q "testModernCustomSubstance14Decoding" \
            "JournalTests/DecodingTests.swift"
          grep -q "drcarlosaraujocastro-ai/psychonautwiki-journal-ios" \
            "PsychonautWiki Journal/Settings/SettingsScreen.swift"

      - name: Commit generated source changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Generated project changes are already persisted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "PsychonautWiki Journal.xcodeproj/project.pbxproj" \
            "PsychonautWiki Journal/PsychonautWiki Journal.entitlements" \
            "PsychonautWiki Journal/Decoding/Substance.swift" \
            "PsychonautWiki Journal/Decoding/SubstanceRepo.swift" \
            "PsychonautWiki Journal/Search/SearchScreen.swift" \
            "PsychonautWiki Journal/Search/Custom Substance/AddCustomSubstance-ViewModel.swift" \
            "PsychonautWiki Journal/Search/Custom Substance/AddCustomSubstanceView.swift" \
            "PsychonautWiki Journal/Search/Substance/SubstanceScreen.swift" \
            "PsychonautWiki Journal/Settings/Settings-ViewModel.swift" \
            "PsychonautWiki Journal/Settings/SettingsScreen.swift" \
            "PsychonautWiki Journal/Safer/Screens/TestingServicesScreen.swift" \
            "PsychonautWiki Journal/Settings/Components/Share/ShareScreen.swift" \
            "JournalTests/DecodingTests.swift"
          git commit -m "Persist modern custom substance deletion"
          git push origin "HEAD:${{ github.ref_name }}"

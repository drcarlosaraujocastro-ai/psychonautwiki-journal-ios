name: Deploy Journal Webapp to Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'webapp/**'
      - 'PsychonautWiki Journal/substances.json'
      - '.github/workflows/webapp-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble static site
        shell: bash
        run: |
          mkdir -p _site/data
          cp -R webapp/. _site/
          cp 'PsychonautWiki Journal/substances.json' _site/data/substances.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
